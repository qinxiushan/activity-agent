name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Job 1: Lint + Typecheck + Smoke (fast, no secrets, always runs)
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Typecheck + Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: node_modules/.bin/tsc --noEmit

      - name: Unit + integration smoke
        run: npm run test:smoke

      - name: Eval V1 deterministic contract
        run: npm run test:eval:v1

      - name: Agent control A/B contract
        run: npm run test:eval:ab

      - name: Eval V2 preference contract
        run: npm run test:eval:v2

  # ─────────────────────────────────────────────────────────────────────
  # Job 2: Real LLM E2E (slow, needs API key, manual only)
  #
  # Triggers:
  #   - workflow_dispatch only: avoids spending model credits on every push
  #
  # Required secret:
  #   - DEEPSEEK_API_KEY  (https://platform.deepseek.com)
  #
  # To swap providers, change the JSON below to match any other
  # pi-coding-agent built-in provider. See docs/MODEL_CONFIG.md.
  # ─────────────────────────────────────────────────────────────────────
  e2e:
    name: Real LLM E2E (deepseek)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DATABASE_URL: postgres://activity:activity_dev@127.0.0.1:55432/activity_agent
      REDIS_URL: redis://127.0.0.1:56379
      STORAGE_BACKEND: postgres
      AUTH_MODE: optional
      RATE_LIMIT_ENABLED: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: activity
          POSTGRES_PASSWORD: activity_dev
          POSTGRES_DB: activity_agent
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U activity -d activity_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Require DeepSeek API key
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY is not configured. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install jq (for safe JSON construction)
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: Write deepseek config (~/.pi/agent/{settings,auth}.json)
        run: |
          mkdir -p ~/.pi/agent
          cat > ~/.pi/agent/settings.json <<'EOF'
          {
            "defaultProvider": "deepseek",
            "defaultModel": "deepseek-v4-flash",
            "defaultThinkingLevel": "high"
          }
          EOF
          jq -n --arg key "$DEEPSEEK_API_KEY" \
            '{deepseek: {type: "api_key", key: $key}}' > ~/.pi/agent/auth.json
          chmod 600 ~/.pi/agent/auth.json
          echo "Config written:"
          cat ~/.pi/agent/settings.json
          echo "---"
          stat -c '%a %n' ~/.pi/agent/auth.json

      - name: Run e2e (auto-starts dev server + runs test + cleans up)
        run: npm run e2e

  auth-e2e:
    name: Required Auth E2E
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://activity:activity_dev@127.0.0.1:55432/activity_agent
      REDIS_URL: redis://127.0.0.1:56379
      STORAGE_BACKEND: postgres
      AUTH_MODE: required
      AUTH_SECRET: ci-auth-secret
      RATE_LIMIT_ENABLED: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: activity
          POSTGRES_PASSWORD: activity_dev
          POSTGRES_DB: activity_agent
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U activity -d activity_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run required-auth e2e
        run: npm run e2e:auth
